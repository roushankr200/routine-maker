{% extends "base.html" %}{% block body %}
<h1>Subjects</h1>
<form method="post" action="{{ url_for('subject_save') }}"><input type="hidden" name="id" id="sid">
<input name="name" id="sname" placeholder="Subject name" required><input name="code" id="scode" placeholder="Code e.g. CA501" required>
<select name="type" id="stype"><option value="theory">Theory</option><option value="lab">Lab (2 consecutive periods)</option></select>
<button class="btn primary">Save Subject</button></form>
<table><tr><th>Code</th><th>Name</th><th>Type</th><th>Actions</th></tr>
{% for s in subjects %}<tr><td>{{ s.code }}</td><td>{{ s.name }}</td><td>{{ s.type }}</td><td>
<button class="btn" onclick='sid.value={{ s.id }};sname.value={{ s.name|tojson }};scode.value={{ s.code|tojson }};stype.value={{ s.type|tojson }}'>Edit</button>
<form class="inline" method="post" action="{{ url_for('subject_delete', sid=s.id) }}" onsubmit="return confirm('Delete subject?')"><button class="btn danger">Delete</button></form></td></tr>{% endfor %}</table>{% endblock %}
