{% extends "base.html" %}{% block body %}
<h1>Time Structure Setup</h1><p>Changing this clears any generated routine.</p>
<form method="post"><label>Working days (comma separated)<br><input name="days" value="{{ days_str }}" size="70" required></label><br>
<label>Periods per day <input name="periods_per_day" type="number" value="{{ cfg.periods_per_day }}" min="1" max="10" required></label><br>
<label>Lunch after period <input name="lunch_after" type="number" value="{{ cfg.lunch_after or '' }}" min="1" max="9"> (blank = none; labs never span lunch)</label><br>
<label>Period duration (minutes) <input name="period_duration" type="number" value="{{ cfg.period_duration }}"></label><br>
<button class="btn primary">Save Setup</button></form>{% endblock %}
