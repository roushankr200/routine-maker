services:
  - type: web
    name: routine-maker-mern
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Set this manually in the Render dashboard to your MongoDB Atlas
      # connection string. Without it the server falls back to an
      # in-memory MongoDB (data resets on restart — demo only).
      - key: MONGODB_URI
        sync: false
