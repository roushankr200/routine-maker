services:
  - type: web
    name: routine-maker-mern
    runtime: node
    plan: free
    # --include=dev: Render installs with NODE_ENV=production, which would
    # otherwise skip the devDependencies the client build (vite, tsc) needs.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_SIGNUP_CODE
        generateValue: true
      # Set this manually in the Render dashboard to your MongoDB Atlas
      # connection string. Without it the server falls back to an
      # in-memory MongoDB (data resets on restart — demo only).
      - key: MONGODB_URI
        sync: false
